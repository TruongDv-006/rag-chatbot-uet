version: '3.8'

service:
  
  postgres_db:
    image: postgres:15-alpline 
    container-name: uet_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: uet_rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - rag_network
  

  qdrant_db:
    image: qdrant/qdrant:latest
    container-name: uet_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - .qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks::
      - rag_network

  
  minio_storage:
    image: minio/minio:latest
    container-name: uet_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - rag_network

  redis:
    image: redis:7-apline
    container-name: uet_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - rag_network


  backend-api:




  


  networks:
    rag_network:
      driver: bridge
  
  volumes:
    postgres_data
    qdrant_data