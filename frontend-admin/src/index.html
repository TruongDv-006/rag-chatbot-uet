<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ tay UET Chatbot</title>
    <!-- 1. Đường dẫn liên kết đến file CSS để sau này làm đẹp -->
    <link rel="stylesheet" href="css/style.css">
    <!-- 2. Nhúng thư viện icon từ trên mạng về để có hình nút gửi máy bay giấy -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Khung lớn bao bọc toàn bộ ứng dụng Chat -->
    <div class="chat-container">
        
        <!-- Thanh tiêu đề ở trên cùng -->
        <header class="chat-header">
            <h2>Sổ tay UET Chatbot</h2>
        </header>
        
        <!-- Vùng không gian hiển thị các tin nhắn chat (Đặt id để JS sau này tìm thấy) -->
        <main class="chat-box" id="chatBox">
            <!-- Hiện tại để trống, sau này JavaScript sẽ tự động chèn tin nhắn vào đây -->
        </main>

        <!-- Thanh công cụ nhập liệu ở dưới cùng -->
        <footer class="chat-input-area">
            <!-- Ô để người dùng gõ chữ -->
            <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn..." />
            <!-- Nút bấm gửi tin nhắn -->
            <button id="sendBtn">
                <i class="fas fa-paper-plane"></i> <!-- Icon máy bay giấy -->
            </button>
        </footer>

    </div>

    <!-- 3. Nhúng file JavaScript đầu não vào. 
         Lưu ý phải có type="module" thì các file JS sau này mới kết nối theo kiểu OOP được -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
