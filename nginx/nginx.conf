events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Upstream
    upstream backend_api {
        server backend-api:8000;
    }

    # =========================================================
    # Server: Cổng 80 – API Gateway chính
    # Nginx nhận mọi request, phân loại và chuyển tiếp đúng chỗ
    # =========================================================
    server {
        listen 80;
        server_name _;

        # --- PROXY: Backend API ---
        location /api/ {
            proxy_pass         http://backend_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   Connection       "";
            proxy_read_timeout 120s;
        }

        # --- Static: Login (mặc định, /) ---
        location / {
            proxy_pass http://uet_frontend_login:80;
        }

        # --- Static: User Chatbot ---
        location /chat/ {
            proxy_pass http://uet_frontend_user:80/;
        }

        # --- Static: Admin Dashboard ---
        location /admin-panel/ {
            proxy_pass http://uet_frontend_admin:80/;
        }

        # --- Favicon ---
        location = /favicon.ico {
            proxy_pass http://uet_frontend_user/favicon.ico;
            access_log off;
            log_not_found off;
        }
    }
}
